name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write # Sigstore keyless signing via GitHub OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web UI
        run: |
          make web
          git checkout -- internal/web/dist/.gitkeep

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          COSIGN_YES: "true"

      - name: Update compatibility package feeds
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for entry in "homebrew-tap homebrew-dops Formula/dops.rb" "scoop-bucket scoop-dops dops.json"; do
            read -r source target path <<< "$entry"
            content=$(gh api "repos/$OWNER/$source/contents/$path" --jq .content)
            sha=$(gh api "repos/$OWNER/$target/contents/$path" --jq .sha)
            jq -n --arg content "$content" --arg sha "$sha" \
              '{message: "chore: synchronize dops release manifest", content: $content, sha: $sha}' > "$RUNNER_TEMP/manifest.json"
            gh api --method PUT "repos/$OWNER/$target/contents/$path" \
              --input "$RUNNER_TEMP/manifest.json" > /dev/null
          done

  winget:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: RunDops.dops
          installers-regex: '\.zip$'
          max-versions-to-keep: 5
          fork-user: ${{ github.repository_owner }}
          token: ${{ secrets.WINGET_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: docker_push
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - uses: sigstore/cosign-installer@v3

      - name: Sign container image
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign ghcr.io/${{ github.repository }}@${{ steps.docker_push.outputs.digest }}

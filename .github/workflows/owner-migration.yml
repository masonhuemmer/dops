name: Verify owner migration
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publishing-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check release token repository access
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for repo in dops homebrew-tap scoop-bucket homebrew-dops scoop-dops; do
            test "$(gh api "repos/$OWNER/$repo" --jq .permissions.push)" = true
            echo "Release token can write $OWNER/$repo"
          done
      - name: Check WinGet token fork access
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$OWNER/winget-pkgs" --jq .permissions.push)" = true
          echo "WinGet token can write $OWNER/winget-pkgs"
  container-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Preserve container tags and digests
        env:
          REGISTRY_TOKEN: ${{ secrets.GH_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          DESTINATION: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, subprocess, urllib.request
          source = "rundops/dops"
          destination = os.environ["DESTINATION"]
          basic = base64.b64encode((os.environ["REGISTRY_USER"] + ":" + os.environ["REGISTRY_TOKEN"]).encode()).decode()
          def token(repo, actions):
              url = "https://ghcr.io/token?service=ghcr.io&scope=repository:" + repo + ":" + actions
              request = urllib.request.Request(url, headers={"Authorization": "Basic " + basic})
              return json.load(urllib.request.urlopen(request))["token"]
          def request(repo, suffix, credential):
              url = "https://ghcr.io/v2/" + repo + "/" + suffix
              return urllib.request.urlopen(urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + credential,
                  "Accept": "application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json"}))
          old_token = token(source, "pull")
          print("Source latest digest: " + request(source, "manifests/latest", old_token).headers["Docker-Content-Digest"], flush=True)
          tags = json.load(request(source, "tags/list?n=1000", old_token))["tags"]
          assert tags and len(tags) < 1000, "Container tag enumeration incomplete"
          for tag in tags:
              old_digest = request(source, "manifests/" + tag, old_token).headers["Docker-Content-Digest"]
              subprocess.run(["docker", "buildx", "imagetools", "create", "--prefer-index=false", "--tag", "ghcr.io/" + destination + ":" + tag, "ghcr.io/" + source + "@" + old_digest], check=True)
              new_token = token(destination, "pull")
              new_digest = request(destination, "manifests/" + tag, new_token).headers["Docker-Content-Digest"]
              assert old_digest == new_digest, "Container digest changed for " + tag
              print(tag + " " + new_digest, flush=True)
          print("Preserved " + str(len(tags)) + " container tags")
          PYTHON

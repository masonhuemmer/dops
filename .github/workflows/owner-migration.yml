name: Verify owner migration
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publishing-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check release token repository access
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for repo in dops homebrew-tap scoop-bucket homebrew-dops scoop-dops; do
            test "$(gh api "repos/$OWNER/$repo" --jq .permissions.push)" = true
            echo "Release token can write $OWNER/$repo"
          done
      - name: Check WinGet token fork access
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$OWNER/winget-pkgs" --jq .permissions.push)" = true
          echo "WinGet token can write $OWNER/winget-pkgs"
  container-access:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release token can publish the migrated container
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, urllib.request
          repo = os.environ["REPOSITORY"]
          basic = base64.b64encode((os.environ["REGISTRY_USER"] + ":" + os.environ["REGISTRY_TOKEN"]).encode()).decode()
          url = "https://ghcr.io/token?service=ghcr.io&scope=repository:" + repo + ":pull,push"
          token = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": "Basic " + basic})))["token"]
          url = "https://ghcr.io/v2/" + repo + "/manifests/latest"
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.oci.image.manifest.v1+json"}
          response = urllib.request.urlopen(urllib.request.Request(url, headers=headers))
          digest = response.headers["Docker-Content-Digest"]
          content_type = response.headers["Content-Type"]
          manifest = response.read()
          headers["Content-Type"] = content_type
          result = urllib.request.urlopen(urllib.request.Request(url, data=manifest, headers=headers, method="PUT"))
          assert result.headers["Docker-Content-Digest"] == digest
          print("Repository release token can pull and push the unchanged latest manifest: " + digest)
          PYTHON
